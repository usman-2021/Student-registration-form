<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Registration Form </h1>
    <form>
        <label>Full name </label>
        <input type="text" name= Full name ,enter placeholder="Full name">
        <br><br>
        <label>Enter email</label>
        <input type="text" name=Email, enter placeholder="Email">
        <br><br>
        <label>Gender</label>
        <input type="radio" name=gender value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <br><br>
        <label>Password </label>
        <input type="password" name=Password,enter placeholder="password">
        <br><br>
        <label>Subject</label>
        <select name="Department">
            <option value="">Select department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Artifical intelligence">Artifical intelligence</option>
            <option value="English Literature">English Literature</option>
        </select>
        <br><br>
         <label>Confirm Password </label>
        <input type="password" name=Confirm Password,enter placeholder="password">
        <br><br>
        <input type="submit" value="Submit">
    </form>
